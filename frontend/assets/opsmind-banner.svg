<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400">
      <stop stop-color="#050816"></stop>
      <stop offset="0.5" stop-color="#0B1026"></stop>
      <stop offset="1" stop-color="#050816"></stop>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D4FF"></stop>
      <stop offset="1" stop-color="#7C3AED"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"></rect>

  <!-- Grid -->
  <g opacity="0.12" stroke="#5B6B95">
    <path d="M0 80H1200"></path>
    <path d="M0 160H1200"></path>
    <path d="M0 240H1200"></path>
    <path d="M0 320H1200"></path>
    <path d="M150 0V400"></path>
    <path d="M300 0V400"></path>
    <path d="M450 0V400"></path>
    <path d="M600 0V400"></path>
    <path d="M750 0V400"></path>
    <path d="M900 0V400"></path>
    <path d="M1050 0V400"></path>
  </g>

  <!-- Moving particles -->
  <g fill="#00D4FF" filter="url(#glow)">
    <circle cx="100" cy="90" r="2">
      <animate attributeName="cy" values="90;310;90" dur="5s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="1080" cy="300" r="2">
      <animate attributeName="cy" values="300;80;300" dur="6s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#cyan)" stroke-width="2" opacity="0.55">
    <path d="M180 200 L350 120 L600 200 L850 120 L1020 200">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="3s" repeatCount="indefinite"></animate>
    </path>

    <path d="M180 200 L350 280 L600 200 L850 280 L1020 200" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="2s" repeatCount="indefinite"></animate>
    </path>
  </g>

  <!-- Service nodes -->
  <g font-family="Arial, sans-serif" text-anchor="middle">

    <g>
      <circle cx="180" cy="200" r="38" fill="#0B122A" stroke="#00D4FF" stroke-width="2"></circle>
      <circle cx="180" cy="200" r="28" fill="none" stroke="#00D4FF" opacity="0.3">
        <animate attributeName="r" values="28;38;28" dur="2s" repeatCount="indefinite"></animate>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"></animate>
      </circle>
      <text x="180" y="205" fill="white" font-size="13" font-weight="bold">AWS</text>
    </g>

    <g>
      <circle cx="350" cy="120" r="38" fill="#0B122A" stroke="#2496ED" stroke-width="2"></circle>
      <text x="350" y="125" fill="white" font-size="13" font-weight="bold">DOCKER</text>
    </g>

    <g>
      <circle cx="350" cy="280" r="38" fill="#0B122A" stroke="#326CE5" stroke-width="2"></circle>
      <text x="350" y="285" fill="white" font-size="13" font-weight="bold">K8S</text>
    </g>

    <g>
      <circle cx="850" cy="120" r="38" fill="#0B122A" stroke="#D33833" stroke-width="2"></circle>
      <text x="850" y="125" fill="white" font-size="13" font-weight="bold">JENKINS</text>
    </g>

    <g>
      <circle cx="850" cy="280" r="38" fill="#0B122A" stroke="#7C3AED" stroke-width="2"></circle>
      <text x="850" y="285" fill="white" font-size="13" font-weight="bold">CI/CD</text>
    </g>

  </g>

  <!-- Central Core -->
  <g filter="url(#glow)">
    <circle cx="600" cy="200" r="68" fill="#090F25" stroke="url(#cyan)" stroke-width="3"></circle>
    <circle cx="600" cy="200" r="54" fill="none" stroke="#00D4FF" opacity="0.25">
      <animate attributeName="r" values="50;64;50" dur="2.5s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <text x="600" y="194" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle">
    OPSMIND
  </text>

  <text x="600" y="218" fill="#8FA3C7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    DEVOPS COMMAND CENTER
  </text>

  <!-- Header -->
  <text x="600" y="45" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" letter-spacing="5" text-anchor="middle">
    MONITOR • DETECT • ANALYZE • AUTOMATE
  </text>

  <!-- Bottom status -->
  <g font-family="Arial, sans-serif">
    <circle cx="430" cy="350" r="5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"></animate>
    </circle>

    <text x="445" y="355" fill="#8FA3C7" font-size="12">
      SYSTEMS OPERATIONAL
    </text>

    <text x="755" y="355" fill="#596B91" font-size="12">
      CLOUD • CONTAINERS • CI/CD
    </text>
  </g>
</svg>